name: Automated Weather Forecast Logger

on:
  workflow_dispatch:
    inputs:
      retrain:
        description: "Refresh rolling 90-day datasets and retrain models"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: weather-cron-logger
  cancel-in-progress: false

jobs:
  log-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache 90-day weather datasets and compiled models
        uses: actions/cache@v5
        with:
          path: |
            data
            models
          key: nir-weather-models-v2_0-${{ github.run_id }}
          restore-keys: |
            nir-weather-models-v2_0-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run weather logger for all 58 NIR municipalities
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ github.event.inputs.retrain }}" == "true" ]; then
            echo "Weekly rolling-window retraining enabled..."
            python3 main.py --all --retrain
          else
            python3 main.py --all
          fi
