name: Automated Weather Forecast Logger

on:
  schedule:
    - cron: "17 */3 * * *"  # Offset to :17 past every 3rd UTC hour to avoid :00 queue drops
  workflow_dispatch:       # Allows manual & API-triggered runs

concurrency:
  group: weather-cron-logger
  cancel-in-progress: false

jobs:
  log-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run weather logger for all 58 NIR municipalities
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python3 main.py --all
